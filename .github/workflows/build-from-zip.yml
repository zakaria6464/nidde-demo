name: Build NIDDE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o NIDDE_ANDROID_TEST_PROJECT_V1.0.0.zip -d extracted

          if [ -f extracted/settings.gradle ] || [ -f extracted/settings.gradle.kts ]; then
            echo "Project found at root"
          else
            PROJECT_DIR=$(find extracted -maxdepth 2 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -print -quit | xargs -r dirname)
            if [ -n "$PROJECT_DIR" ]; then
              cp -a "$PROJECT_DIR"/. extracted/
            fi
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        working-directory: extracted
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIDDE-APK
          path: extracted/app/build/outputs/apk/debug/*.apk
