name: Build NIDDE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract NIDDE project
        run: |
          set -e
          mkdir -p extracted
          unzip -o NIDDE_BUILD_READY_V1.0.0.zip -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: extracted/NIDDE_ANDROID_APP
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -f extracted/NIDDE_ANDROID_APP/app/build/outputs/apk/debug/app-debug.apk
          ls -lh extracted/NIDDE_ANDROID_APP/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIDDE-APK
          path: extracted/NIDDE_ANDROID_APP/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
